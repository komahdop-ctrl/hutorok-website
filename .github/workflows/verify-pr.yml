name: Verify pull request
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck and build
        run: npm run build
      - name: Smoke-test output
        run: |
          test -s dist/index.html
          test -s dist/bee.svg
          grep -q 'Пасека' dist/index.html
